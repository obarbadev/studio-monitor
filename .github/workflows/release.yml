name: Release Electron
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if(process.env.RELEASE_TAG!=="v"+require("./package.json").version)process.exit(1)'
      - run: npm test
      - run: npm run test:ui
  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - if: runner.os == 'Windows'
        run: npm run test:ui
      - name: Package native installer and archive
        run: npm run dist:${{ matrix.platform }} -- --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: release
          merge-multiple: true
      - name: Source archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix=studio-monitor/ --output="release/Studio-Monitor-${RELEASE_TAG}-source.zip" HEAD
          git archive --format=tar.gz --prefix=studio-monitor/ --output="release/Studio-Monitor-${RELEASE_TAG}-source.tar.gz" HEAD
      - run: npm run release:checksums
      - name: Publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.dmg release/*.exe release/*.zip release/*.tar.gz release/SHA256SUMS.txt --verify-tag --prerelease --title "Studio Monitor $RELEASE_TAG" --notes-file docs/releases/0.1.0.md
